[project]
name = "mrie"
version = "0.1.0"
description = "MRE — Modular Research Engine"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "MRE" }]
dependencies = [
  "openai>=2.0.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.28.0",
  "pyyaml>=6.0.0",
  "croniter>=6.0.0",
  "feedparser>=6.0.0",
  "rich>=14.0.0",
  "tenacity>=9.0.0",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.12.0",
]

[project.scripts]
mrie = "mrie.cli.mrie:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mrie*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
