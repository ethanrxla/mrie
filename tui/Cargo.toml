[package]
name = "mrie-tui"
version = "0.1.0"
edition = "2021"
description = "Multi-screen terminal interface for MRE"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
# Ratatui 0.29 supports Rust 1.74, but newer 0.3.x instability releases raised
# their MSRV. Pin the compatible transitive dependency for reproducible builds.
instability = "=0.3.7"
ratatui = "0.29"
serde_json = "1.0"
